[project]
dependencies=[
    "python-chess>=1.999",
    "tempo-chess-core==0.1.0",
    "tempo-evidence-math==0.1.0",
    "tempo-game-evidence-contracts==3.0.0",
    "tempo-game-review-contracts==0.1.0",
    "tempo-learning-review==0.1.0",
    "tempo-scheduling==0.2.0",
]
description="Add your description here"
name="backend"
readme="README.md"
requires-python=">=3.12,<3.15"
version="0.1.0"

[dependency-groups]
dev=[
    "grimp==3.17",
    "import-linter==2.15",
    "pytest>=9.1.1",
    "ruff>=0.17.5",
    "ty>=0.0.104",
]

[tool.uv.sources]
tempo-chess-core             ={ path="../packages/chess-core" }
tempo-evidence-math          ={ path="../packages/evidence-math" }
tempo-game-evidence-contracts={ path="../contracts/game-evidence" }
tempo-game-review-contracts  ={ path="../packages/game-review-contracts" }
tempo-learning-review        ={ path="../services/learning/application" }
tempo-scheduling             ={ path="../packages/scheduling" }

[tool.pytest.ini_options]
pythonpath=[".", "../database"]

[tool.ruff]
ignore=["PLC0105"]
