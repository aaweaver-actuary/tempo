[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tempo-ranking-evaluation"
version = "0.1.0"
description = "Independent deterministic offline opening ranking evaluation"
requires-python = ">=3.12,<3.15"
dependencies = ["tempo-evidence-math==0.1.0"]

[project.scripts]
tempo-evaluate-opening-rankings = "tempo_ranking_evaluation.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/tempo_ranking_evaluation"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml", "requirements-dev.in", "requirements-dev.lock", "README.md", "REGRESSIONS.md", "docs", "qualify.py", "qualification"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
