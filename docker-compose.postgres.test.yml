# Disposable PostgreSQL product stack; never mounts the live SQLite volume.
services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: tempo
      POSTGRES_PASSWORD_FILE: /run/secrets/admin_password
    secrets: [admin_password]
    volumes: [postgres-test-data:/var/lib/postgresql]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d tempo"]
      interval: 2s
      timeout: 2s
      retries: 30

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes: [redis-test-data:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  schema:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command:
      - python
      - /source/scripts/bootstrap_postgres_test.py
      - --admin-dsn
      - postgresql://postgres@postgres:5432/tempo
      - --reader-password-file
      - /run/secrets/reader_password
      - --writer-password-file
      - /run/secrets/writer_password
    environment:
      PGPASSFILE: /run/secrets/admin_pgpass
      TEMPO_TEST_INSTANCE: disposable
      # The guided repair rehearsal invokes the real graph admission gate.
      TEMPO_REDIS_URL: redis://redis:6379/0
    secrets:
      - source: admin_pgpass
        mode: 0400
      - reader_password
      - writer_password
    volumes: [".:/source:ro"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TEMPO_DATABASE_READ_URL: postgresql://tempo_reader@postgres:5432/tempo
      TEMPO_POSTGRES_BACKGROUND_TRANSACTION_TIMEOUT_MS: ${TEMPO_POSTGRES_BACKGROUND_TRANSACTION_TIMEOUT_MS:-250}
      TEMPO_POSTGRES_BACKGROUND_LOCK_TIMEOUT_MS: ${TEMPO_POSTGRES_BACKGROUND_LOCK_TIMEOUT_MS:-25}
      TEMPO_REDIS_URL: redis://redis:6379/0
      TEMPO_COORDINATOR_MODE: external
      TEMPO_TEST_INSTANCE: disposable
      PGPASSFILE: /run/secrets/reader_pgpass
      TZ: America/New_York
    secrets:
      - source: reader_pgpass
        mode: 0400
    depends_on:
      schema: {condition: service_completed_successfully}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 3s
      timeout: 4s
      retries: 60
      start_period: 10s

  foreground-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--queues=foreground", "--concurrency=2", "--prefetch-multiplier=1", "--loglevel=INFO"]
    environment:
      TEMPO_DATABASE_WRITE_URL: postgresql://tempo_writer@postgres:5432/tempo
      TEMPO_DATABASE_READ_URL: postgresql://tempo_writer@postgres:5432/tempo
      TEMPO_POSTGRES_BACKGROUND_TRANSACTION_TIMEOUT_MS: ${TEMPO_POSTGRES_BACKGROUND_TRANSACTION_TIMEOUT_MS:-250}
      TEMPO_POSTGRES_BACKGROUND_LOCK_TIMEOUT_MS: ${TEMPO_POSTGRES_BACKGROUND_LOCK_TIMEOUT_MS:-25}
      TEMPO_REDIS_URL: redis://redis:6379/0
      PGPASSFILE: /run/secrets/writer_pgpass
      TZ: America/New_York
    secrets:
      - source: writer_pgpass
        mode: 0400
    depends_on:
      schema: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  background-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--queues=background", "--concurrency=1", "--prefetch-multiplier=1", "--loglevel=INFO"]
    environment:
      TEMPO_DATABASE_WRITE_URL: postgresql://tempo_writer@postgres:5432/tempo
      TEMPO_DATABASE_READ_URL: postgresql://tempo_writer@postgres:5432/tempo
      TEMPO_POSTGRES_BACKGROUND_TRANSACTION_TIMEOUT_MS: ${TEMPO_POSTGRES_BACKGROUND_TRANSACTION_TIMEOUT_MS:-250}
      TEMPO_POSTGRES_BACKGROUND_LOCK_TIMEOUT_MS: ${TEMPO_POSTGRES_BACKGROUND_LOCK_TIMEOUT_MS:-25}
      TEMPO_REDIS_URL: redis://redis:6379/0
      PGPASSFILE: /run/secrets/writer_pgpass
      TZ: America/New_York
    secrets:
      - source: writer_pgpass
        mode: 0400
    depends_on:
      schema: {condition: service_completed_successfully}
      redis: {condition: service_healthy}

  background-scheduler:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO"]
    environment:
      TEMPO_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports: ["127.0.0.1:${TEMPO_PG_TEST_PORT:-4181}:80"]
    depends_on:
      api: {condition: service_healthy}

  defense-engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      TEMPO_API_URL: http://api:8000
      TEMPO_ENGINE_OUTBOX_PATH: /state/pending-command.json
    volumes: [engine-test-operations:/state]
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 512m
    cpus: 1

  maia-worker:
    build:
      context: .
      dockerfile: Dockerfile.maia
    environment:
      TEMPO_API_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    mem_limit: 768m
    cpus: 1

volumes:
  engine-test-operations:
  postgres-test-data:
  redis-test-data:

secrets:
  admin_password:
    file: ${TEMPO_PG_TEST_SECRETS:?Set disposable PostgreSQL secrets}/admin_password
  admin_pgpass:
    file: ${TEMPO_PG_TEST_SECRETS}/admin_pgpass
  reader_password:
    file: ${TEMPO_PG_TEST_SECRETS}/reader_password
  writer_password:
    file: ${TEMPO_PG_TEST_SECRETS}/writer_password
  reader_pgpass:
    file: ${TEMPO_PG_TEST_SECRETS}/reader_pgpass
  writer_pgpass:
    file: ${TEMPO_PG_TEST_SECRETS}/writer_pgpass
