# Use with docker-compose.yml during a stopped-writer maintenance window.
# SQLite import alone needs an explicit read-only snapshot mount at `docker compose run`.
services:
  migration:
    profiles: ["maintenance"]
    build:
      context: .
      dockerfile: Dockerfile.postgres-maintenance
    environment:
      TEMPO_POSTGRES_ADMIN_URL: postgresql://tempo@postgres:5432/tempo
      TEMPO_MIGRATION_DATABASE_URL: postgresql://tempo@postgres:5432/tempo
      PGPASSFILE: /run/secrets/admin_pgpass
    secrets:
      - source: admin_pgpass
        target: admin_pgpass
        mode: 0400
      - source: reader_password
        target: reader_password
        mode: 0400
      - source: writer_password
        target: writer_password
        mode: 0400
    depends_on:
      postgres: {condition: service_healthy}
    command: ["scripts/apply_postgres_migrations.py"]

secrets:
  reader_password:
    file: ${TEMPO_POSTGRES_READER_PASSWORD_FILE:?Set a password file outside the checkout}
  writer_password:
    file: ${TEMPO_POSTGRES_WRITER_PASSWORD_FILE:?Set a password file outside the checkout}
