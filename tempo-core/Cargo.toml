[package]
name = "tempo-core"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Deterministic chess and scheduling core for Tempo"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
fsrs = { version = "6.6.0", default-features = false }
getrandom = { version = "0.4", features = ["wasm_js"] }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde-wasm-bindgen = "0.6"
sha2 = "0.10"
shakmaty = "0.29"
wasm-bindgen = "=0.2.100"

[dev-dependencies]
serde_json = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
