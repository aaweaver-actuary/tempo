# Isolated database/broker stack for data parity and command integration.
# It does not replace the production SQLite Compose stack until cutover gates pass.
services:
  postgres:
    image: postgres:18.6-trixie
    environment:
      POSTGRES_DB: tempo
      POSTGRES_USER: tempo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - tempo-postgres-rehearsal:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempo -d tempo"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - tempo-redis-rehearsal:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  foreground-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--queues=foreground", "--concurrency=2", "--prefetch-multiplier=1", "--loglevel=INFO"]
    environment:
      TEMPO_DATABASE_WRITE_URL: postgresql://tempo_writer@postgres:5432/tempo
      TEMPO_DATABASE_READ_URL: postgresql://tempo_writer@postgres:5432/tempo
      TEMPO_REDIS_URL: redis://redis:6379/0
      PGPASSFILE: /run/secrets/pgpass
    secrets:
      - source: pgpass
        target: pgpass
        mode: 0400
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  background-worker:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--queues=background", "--concurrency=1", "--prefetch-multiplier=1", "--loglevel=INFO"]
    environment:
      TEMPO_DATABASE_WRITE_URL: postgresql://tempo_writer@postgres:5432/tempo
      TEMPO_DATABASE_READ_URL: postgresql://tempo_writer@postgres:5432/tempo
      TEMPO_REDIS_URL: redis://redis:6379/0
      PGPASSFILE: /run/secrets/pgpass
    secrets:
      - source: pgpass
        target: pgpass
        mode: 0400
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  background-scheduler:
    profiles: ["workers"]
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO"]
    environment:
      TEMPO_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  postgres-backup:
    profiles: ["backups"]
    image: postgres:18.6-trixie
    entrypoint: ["sh", "-ec"]
    command: >-
      while :; do
        stamp=$$(date -u +%Y%m%dT%H%M%SZ);
        partial=/backups/tempo-$${stamp}.dump.partial;
        finished=/backups/tempo-$${stamp}.dump;
        pg_dump -h postgres -U tempo -d tempo -Fc -f "$${partial}";
        pg_restore -l "$${partial}" >/dev/null;
        mv "$${partial}" "$${finished}";
        sha256sum "$${finished}" > "$${finished}.sha256";
        find /backups -name 'tempo-*.dump' -mtime +30 -delete;
        find /backups -name 'tempo-*.dump.sha256' -mtime +30 -delete;
        sleep 86400;
      done
    environment:
      PGPASSFILE: /run/secrets/pgpass
    secrets:
      - source: pgpass
        target: pgpass
        mode: 0400
    volumes:
      - tempo-postgres-backups:/backups
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  tempo-postgres-rehearsal:
    external: true
    name: tempo-pg-rehearsal-data
  tempo-redis-rehearsal:
    external: true
    name: tempo-redis-rehearsal-data
  tempo-postgres-backups:
    external: true
    name: tempo-postgres-backups

secrets:
  postgres_admin_password:
    file: ${TEMPO_POSTGRES_ADMIN_PASSWORD_FILE:?Set a password file outside the checkout}
  pgpass:
    file: ${TEMPO_POSTGRES_PGPASS_FILE:?Set a libpq passfile outside the checkout}
