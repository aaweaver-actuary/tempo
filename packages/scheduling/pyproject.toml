[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tempo-scheduling"
version = "0.2.0"
description = "Tempo's existing FSRS scheduling decisions without service infrastructure"
requires-python = ">=3.12,<3.15"
dependencies = ["fsrs==6.3.2"]

[dependency-groups]
dev = ["pytest==9.1.1", "build==1.4.0", "hatchling==1.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tempo_scheduling"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml", "uv.lock", "README.md", "REGRESSIONS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
