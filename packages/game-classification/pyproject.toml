[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tempo-game-classification"
version = "0.1.0"
requires-python = ">=3.12,<3.15"
dependencies = ["tempo-game-review-contracts==0.1.0"]

[tool.uv.sources]
tempo-game-review-contracts = { path = "../game-review-contracts" }
tempo-chess-core = { path = "../chess-core" }

[tool.hatch.build.targets.wheel]
packages = ["src/tempo_game_classification"]

[dependency-groups]
dev = ["pytest==9.1.1", "build==1.4.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
