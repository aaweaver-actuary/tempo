[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tempo-evidence-math"
version = "0.1.0"
description = "Pure policy-conditioned opening evidence mathematics"
requires-python = ">=3.12,<3.15"
dependencies = ["chess==1.11.2", "pydantic==2.12.5", "pydantic-core==2.41.5"]

[tool.hatch.build.targets.wheel]
packages = ["src/tempo_evidence_math"]

[tool.hatch.build.targets.sdist]
include = ["src", "tests", "pyproject.toml", "requirements-dev.in", "requirements-dev.lock", "README.md", "REGRESSIONS.md", "docs", "qualify.py", "qualification"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --import-mode=importlib"
