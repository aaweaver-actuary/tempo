# PostgreSQL/Celery product stack. Migrate and verify data before starting it.
# Keep the SQLite production stack stopped; do not run both against live traffic.
services:
  postgres:
    image: postgres:18.6-trixie
    init: true
    environment:
      POSTGRES_DB: tempo
      POSTGRES_USER: tempo
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_admin_password
    secrets:
      - postgres_admin_password
    volumes:
      - tempo-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tempo -d tempo"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec"]
    volumes:
      - tempo-redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-e", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TEMPO_DATABASE_READ_URL: postgresql://tempo_reader@postgres:5432/tempo
      TEMPO_POSTGRES_BACKGROUND_TRANSACTION_TIMEOUT_MS: ${TEMPO_POSTGRES_BACKGROUND_TRANSACTION_TIMEOUT_MS:-250}
      TEMPO_POSTGRES_BACKGROUND_LOCK_TIMEOUT_MS: ${TEMPO_POSTGRES_BACKGROUND_LOCK_TIMEOUT_MS:-25}
      OPENING_CAPACITY_FRONTIER_EXPANSION: ${OPENING_CAPACITY_FRONTIER_EXPANSION:-0}
      TEMPO_REDIS_URL: redis://redis:6379/0
      TEMPO_COORDINATOR_MODE: external
      PGPASSFILE: /run/secrets/reader_pgpass
      TZ: ${TZ:-America/New_York}
    secrets:
      - source: reader_pgpass
        target: reader_pgpass
        mode: 0400
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s
    restart: unless-stopped

  foreground-worker:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--queues=foreground", "--concurrency=2", "--prefetch-multiplier=1", "--loglevel=INFO"]
    environment:
      TEMPO_DATABASE_WRITE_URL: postgresql://tempo_writer@postgres:5432/tempo
      TEMPO_DATABASE_READ_URL: postgresql://tempo_writer@postgres:5432/tempo
      TEMPO_POSTGRES_BACKGROUND_TRANSACTION_TIMEOUT_MS: ${TEMPO_POSTGRES_BACKGROUND_TRANSACTION_TIMEOUT_MS:-250}
      TEMPO_POSTGRES_BACKGROUND_LOCK_TIMEOUT_MS: ${TEMPO_POSTGRES_BACKGROUND_LOCK_TIMEOUT_MS:-25}
      OPENING_CAPACITY_FRONTIER_EXPANSION: ${OPENING_CAPACITY_FRONTIER_EXPANSION:-0}
      TEMPO_REDIS_URL: redis://redis:6379/0
      PGPASSFILE: /run/secrets/writer_pgpass
      TZ: ${TZ:-America/New_York}
    secrets:
      - source: writer_pgpass
        target: writer_pgpass
        mode: 0400
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  background-worker:
    cpus: 0.35
    mem_limit: 448m
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.celery_app:celery_app", "worker", "--queues=background", "--concurrency=1", "--prefetch-multiplier=1", "--loglevel=INFO"]
    environment:
      TEMPO_DATABASE_WRITE_URL: postgresql://tempo_writer@postgres:5432/tempo
      TEMPO_DATABASE_READ_URL: postgresql://tempo_writer@postgres:5432/tempo
      TEMPO_POSTGRES_BACKGROUND_TRANSACTION_TIMEOUT_MS: ${TEMPO_POSTGRES_BACKGROUND_TRANSACTION_TIMEOUT_MS:-250}
      TEMPO_POSTGRES_BACKGROUND_LOCK_TIMEOUT_MS: ${TEMPO_POSTGRES_BACKGROUND_LOCK_TIMEOUT_MS:-25}
      OPENING_CAPACITY_FRONTIER_EXPANSION: ${OPENING_CAPACITY_FRONTIER_EXPANSION:-0}
      TEMPO_REDIS_URL: redis://redis:6379/0
      TEMPO_LICHESS_EXPLORER_TOKEN: ${TEMPO_LICHESS_EXPLORER_TOKEN:-}
      PGPASSFILE: /run/secrets/writer_pgpass
      TZ: ${TZ:-America/New_York}
    secrets:
      - source: writer_pgpass
        target: writer_pgpass
        mode: 0400
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    restart: unless-stopped

  background-scheduler:
    cpus: 0.05
    mem_limit: 96m
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["celery", "-A", "app.celery_app:celery_app", "beat", "--loglevel=INFO"]
    environment:
      TEMPO_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis: {condition: service_healthy}
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  defense-engine:
    cpus: 0.25
    mem_limit: 384m
    init: true
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      TEMPO_API_URL: http://api:8000
      TEMPO_ENGINE_OUTBOX_PATH: /state/pending-command.json
    volumes:
      - tempo-engine-operations:/state
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  maia-worker:
    cpus: 0.3
    mem_limit: 1024m
    init: true
    build:
      context: .
      dockerfile: Dockerfile.maia
    environment:
      TEMPO_API_URL: http://api:8000
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

  postgres-backup:
    cpus: 0.05
    mem_limit: 96m
    tmpfs: [/var/lib/postgresql]
    image: postgres:18.6-trixie
    entrypoint: ["sh", "-ec"]
    # Saved releases carry these bytes; the owning test checks CLI script parity.
    command:
      - |
        while :; do
          sh -s recurring <<'TEMPO_POSTGRES_BACKUP' || echo 'Backup failed or needs inspection; existing copies preserved.' >&2
        #!/bin/sh
        set -eu

        # Pure admission policy, shared by recurring and explicit maintenance creation.
        backup_action() {
          mode=$$1 completed=$$2 pending=$$3 recent=$$4
          if [ "$$pending" -gt 0 ]; then echo pending; return; fi
          if [ "$$completed" -gt 2 ]; then echo rotation; return; fi
          if [ "$$mode" = recurring ] && [ "$$completed" -eq 2 ]; then echo rotation; return; fi
          if [ "$$mode" = recurring ] && [ "$$recent" -gt 0 ]; then echo recent; return; fi
          if [ "$$completed" -eq 2 ]; then echo stage; else echo create; fi
        }

        # Operations run only when this script is executed, never during policy tests.
        mode=$${1:?Expected recurring, manual or preview}
        cd /backups
        inventory() {
          completed=0 pending=0 recent=0
          for file in tempo-*.dump tempo-*.dump.staged; do
            [ -f "$$file" ] || continue
            status=restore-verification-unrecorded
            case "$$file" in
              *.staged) status=awaiting-restore-verification ;;
            esac
            if [ -f "$$file.restore-verified" ]; then status=restore-verified; fi
            if [ "$$status" = awaiting-restore-verification ]; then
              pending=$$((pending + 1))
            else
              completed=$$((completed + 1))
            fi
            if [ -n "$$(find "$$file" -mmin -1440 -print)" ]; then recent=1; fi
            if [ "$$mode" = preview ]; then printf '%s: %s\n' "$$status" "$$file"; fi
          done
          for file in tempo-*.partial; do
            [ -e "$$file" ] || continue
            pending=$$((pending + 1))
            if [ "$$mode" = preview ]; then printf 'incomplete: %s\n' "$$file"; fi
          done
        }

        case "$$mode" in
          preview)
            inventory
            printf 'Completed copies: %s; incomplete/staged: %s; retained limit: 2.\n' "$$completed" "$$pending"
            [ ! -d .tempo-backup.lock ] || echo 'Backup ownership lock present; creation may be active or interrupted.'
            echo 'No files changed. Select any permanent removal yourself after checking restore verification and operation/migration receipts; keep two usable copies. One verified replacement may temporarily raise the count to three.'
            exit 0 ;;
          recurring|manual) ;;
          *) echo 'Unknown backup operation.' >&2; exit 1 ;;
        esac

        # Fail closed after an unclean exit; never steal an uncertain owner's lock.
        mkdir .tempo-backup.lock 2>/dev/null || { echo 'Backup owner active or interrupted; inspect ownership and preview before retrying.' >&2; exit 1; }
        trap 'rmdir .tempo-backup.lock' EXIT
        trap 'trap - EXIT; echo "Interrupted backup; inspect the retained ownership lock and partial before retrying." >&2; exit 1' HUP INT TERM

        inventory
        action=$$(backup_action "$$mode" "$$completed" "$$pending" "$$recent")
        case "$$action" in
          pending|rotation)
            echo "Backup paused ($$action): $$completed completed copies, $$pending incomplete/staged. Run the rotation preview; user-controlled rotation is required. No copies removed." >&2
            [ "$$mode" = recurring ] && exit 0
            exit 1 ;;
          recent) echo 'Backup not due: an archive was created within 24 hours.' >&2; exit 0 ;;
        esac
        if [ "$$mode" = manual ]; then
          name=$${2:?Expected archive name}
          user=$${3:?Expected PostgreSQL user}
          database=$${4:?Expected PostgreSQL database}
        else
          name=tempo-$$(date -u +%Y%m%dT%H%M%SZ).dump
          user=tempo database=tempo
        fi
        case "$$name" in tempo-*.dump) ;; *) echo 'Invalid backup name.' >&2; exit 1 ;; esac
        case "$$name" in *[!A-Za-z0-9.-]*) exit 1 ;; esac
        if [ "$$action" = stage ]; then name=$$name.staged; fi
        test ! -e "$$name"
        test ! -e "$$name.partial"
        test ! -e "$$name.sha256"
        test ! -e "$$name.restore-verified"
        pg_dump -h postgres -U "$$user" -d "$$database" -Fc -f "$$name.partial"
        pg_restore -l "$$name.partial" >/dev/null
        sha256sum "$$name.partial" | sed "s/  .*/  $$name/" > "$$name.sha256.partial"
        mv "$$name.partial" "$$name"
        mv "$$name.sha256.partial" "$$name.sha256"
        sha256sum -c "$$name.sha256" >&2
        if [ "$$action" = stage ]; then echo 'Replacement staged; preserve both retained copies until restore verification succeeds, then rotate manually.' >&2; fi
        printf 'TEMPO_BACKUP_FILENAME=%s\n' "$$name"
        TEMPO_POSTGRES_BACKUP
          sleep 86400
        done
    environment:
      PGPASSFILE: /run/secrets/admin_pgpass
    secrets:
      - source: admin_pgpass
        target: admin_pgpass
        mode: 0400
    volumes:
      - tempo-postgres-backups:/backups
    depends_on:
      postgres: {condition: service_healthy}
    restart: unless-stopped

volumes:
  tempo-engine-operations:
    external: true
    name: tempo-engine-operations
  tempo-postgres-data:
    external: true
    name: tempo-postgres-data
  tempo-redis-data:
    external: true
    name: tempo-redis-data
  tempo-postgres-backups:
    external: true
    name: tempo-postgres-backups

secrets:
  postgres_admin_password:
    file: ${TEMPO_POSTGRES_ADMIN_PASSWORD_FILE:?Set a password file outside the checkout}
  reader_pgpass:
    file: ${TEMPO_POSTGRES_READER_PGPASS_FILE:?Set a libpq passfile outside the checkout}
  writer_pgpass:
    file: ${TEMPO_POSTGRES_WRITER_PGPASS_FILE:?Set a libpq passfile outside the checkout}
  admin_pgpass:
    file: ${TEMPO_POSTGRES_ADMIN_PGPASS_FILE:?Set a libpq passfile outside the checkout}
