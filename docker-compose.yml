services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TEMPO_DB_PATH: /data/tempo.db
      TZ: ${TZ:-America/New_York}
    ports:
      - "8000:8000"
    volumes:
      - tempo-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

  defense-engine:
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      TEMPO_API_URL: http://api:8000
    depends_on:
      - api
    mem_limit: 512m
    cpus: 1
    restart: unless-stopped

volumes:
  tempo-data:
    name: tempo-data
