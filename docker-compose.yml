services:
  api:
    build:
      context: ./backend
    environment:
      TEMPO_DB_PATH: /data/tempo.db
      TZ: ${TZ:-America/New_York}
    ports:
      - "8000:8000"
    volumes:
      - ./data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api
    restart: unless-stopped
