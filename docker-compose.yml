services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TEMPO_DB_PATH: /data/tempo.db
      TZ: ${TZ:-America/New_York}
    ports:
      - "8000:8000"
    volumes:
      - tempo-data:/data
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "3000:80"
    depends_on:
      - api
    restart: unless-stopped

volumes:
  tempo-data:
    name: tempo-data
