[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tempo-stockfish-client"
version = "1.0.0"
description = "Typed asynchronous client for the independently installed Tempo Stockfish worker"
requires-python = ">=3.12,<3.15"
dependencies = ["tempo-analysis-jobs-contracts==1.0.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tempo_stockfish_client"]

[tool.hatch.build.targets.sdist]
include = ["src", "pyproject.toml"]
