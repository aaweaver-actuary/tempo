name: Issue 33 paired performance evidence

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: issue-33-paired-measurement
  cancel-in-progress: false

jobs:
  paired-measurement:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          path: benchmark/control
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: dfbb66d67b314357e55c2030ff794a15415f316c
          path: benchmark/base
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          ref: 1496021f82bfddd1df8b4276fcc57f7e7dd853df
          path: benchmark/candidate
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - name: Collect sequential evidence on this runner
        env:
          BASE_CHECKOUT: ${{ github.workspace }}/benchmark/base
          CANDIDATE_CHECKOUT: ${{ github.workspace }}/benchmark/candidate
        working-directory: benchmark/control
        run: node scripts/issue-33-paired-measurement.mjs
      - name: Retain complete evidence and failure diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: issue-33-paired-evidence
          retention-days: 90
          if-no-files-found: error
          path: |
            benchmark/control/test-results/
            benchmark/base/test-results/
            benchmark/candidate/test-results/
