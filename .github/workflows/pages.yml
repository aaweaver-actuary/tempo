name: PR243 focused failure audit
on:
  workflow_dispatch:
    inputs:
      verification_only:
        type: boolean
        default: true
      diagnostic_retry:
        type: boolean
        default: false
permissions:
  contents: read
jobs:
  compare:
    name: focused-${{ matrix.source.name }}
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        source:
          - name: base
            ref: c5f773b18c4a5b30a3abda84ecac01ab625a3902
          - name: head
            ref: d0064e8008213b1a2ceb429e2a48a0b19bc5eee5
    steps:
      - uses: actions/checkout@v4
        with:
          path: audit-tools
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.source.ref }}
          path: source
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
      - run: npm ci
        working-directory: source
      - run: npx playwright install --with-deps chromium
        working-directory: source
      - name: Install diagnostic witnesses
        working-directory: source
        run: python3 ../audit-tools/audit/pr243/probe.py
      - name: Execute only the four failed identities
        working-directory: source
        env:
          TEMPO_CI_REPORT: test-results/pr243-focused/browser.json
        run: |
          set -o pipefail
          mkdir -p test-results/pr243-focused
          TEMPO_AUDIT_GREP=$(node -e 'console.log(require("../audit-tools/audit/pr243/selection.json").grep)')
          node scripts/test-postgres-docker.mjs --mode browser --browser-grep "$TEMPO_AUDIT_GREP" 2>&1 | tee test-results/pr243-focused/runner.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: focused-${{ matrix.source.name }}
          path: source/test-results/
          if-no-files-found: error
