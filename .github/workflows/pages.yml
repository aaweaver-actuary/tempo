name: Deploy Tempo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Supersede only the same PR; never abort a running main deployment.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  quality:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@wasm-pack
      - run: npm ci
      - run: pip install -r backend/requirements.txt pytest
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm test
      - name: Download latest successful main performance artifacts
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          baseline_run_id=$(gh run list --workflow pages.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId' || true)
          if [ -n "$baseline_run_id" ]; then
            gh run download "$baseline_run_id" --name tempo-test-results --dir "$RUNNER_TEMP/tempo-performance-baseline" || true
          fi
      - name: Summarize performance artifacts
        if: always()
        run: |
          baseline_dir="$RUNNER_TEMP/tempo-performance-baseline/performance"
          if [ -f "$baseline_dir/test-stages-full.json" ]; then
            node scripts/report-performance.mjs --baseline "$baseline_dir"
          else
            node scripts/report-performance.mjs
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tempo-test-results
          path: test-results/
          if-no-files-found: warn
  build:
    if: github.event_name != 'pull_request'
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@wasm-pack
      - run: npm ci
      - run: npm run build:static
      - run: npm run verify:static
      - uses: actions/upload-pages-artifact@v3
        with:
          path: pages-dist
  deploy:
    concurrency:
      group: tempo-pages-deployment
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
