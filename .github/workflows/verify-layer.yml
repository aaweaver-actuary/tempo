name: Verification layer
on:
  workflow_call:
    inputs:
      candidate_sha:
        required: true
        type: string
      layer:
        required: true
        type: string
      diagnostic_retry:
        default: false
        type: boolean
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.candidate_sha }}
      - uses: actions/download-artifact@v4
        with:
          name: ci-plan
          path: test-results/ci
      - uses: actions/setup-node@v4
        with:
          node-version: '22.23.3'
          cache: npm
      - uses: actions/setup-python@v5
        if: inputs.layer == 'frontend' || inputs.layer == 'backend'
        with:
          python-version: '3.12.14'
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Python contract and backend prerequisites
        if: inputs.layer == 'frontend' || inputs.layer == 'backend'
        run: pip install -r backend/requirements.txt pytest
      - uses: dtolnay/rust-toolchain@1.99.0
        if: inputs.layer == 'build'
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        if: inputs.layer == 'build'
        with:
          cache-on-failure: true
      - uses: taiki-e/install-action@v2
        if: inputs.layer == 'build'
        with:
          tool: wasm-pack@0.15.0
      - run: npm ci
      - name: Browser prerequisites
        if: inputs.layer == 'browser' || inputs.layer == 'quarantine'
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Run isolated verification layer
        env:
          TEMPO_LAYER: ${{ inputs.layer }}
          TEMPO_DIAGNOSTIC_RETRY: ${{ inputs.diagnostic_retry }}
        run: |
          mkdir -p test-results/ci
          set -o pipefail
          node scripts/ci-run-layer.mjs "$TEMPO_LAYER" 2>&1 | tee "test-results/ci/$TEMPO_LAYER.log"
      - name: Retain layer results and diagnostics
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ci-result-${{ inputs.layer }}
          path: test-results/
          if-no-files-found: error
          overwrite: true
