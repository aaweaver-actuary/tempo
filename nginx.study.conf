server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    add_header Cross-Origin-Opener-Policy same-origin always;
    add_header Cross-Origin-Embedder-Policy require-corp always;

    # ^~ keeps API requests out of static-extension and SPA fallback handling.
    # proxy_pass has no URI suffix, so nginx forwards the complete request path.
    location ^~ /api/ {
        client_max_body_size 50m;
        proxy_pass http://learning:8001;
        proxy_read_timeout 180s;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tempo-Workspace $http_x_tempo_workspace;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $http_host;
    }

    location ^~ /health/ {
        proxy_pass http://learning:8001;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header X-Tempo-Workspace $http_x_tempo_workspace;
        proxy_set_header Origin $http_origin;
        proxy_set_header Host $http_host;
    }

    # Static files, including missing assets, never receive the SPA document.
    location ~* \.(?:avif|css|eot|gif|ico|jpe?g|js|json|map|mjs|mp3|ogg|otf|png|svg|ttf|txt|wasm|wav|webmanifest|webp|woff2?)$ {
        # Inherit nginx's full MIME table; this default supplies the standard
        # JavaScript type for .mjs, which the bundled table does not list.
        default_type application/javascript;
        try_files $uri =404;
    }

    # Only extensionless frontend navigation falls back to the Study shell.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
