services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      TEMPO_DB_PATH: /data/tempo.db
      TEMPO_COORDINATOR_MODE: external
      TZ: ${TZ:-America/New_York}
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - tempo-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2).close()"]
      interval: 3s
      timeout: 3s
      retries: 60
      start_period: 10s

  web:
    build:
      context: .
      dockerfile: Dockerfile.web
    ports:
      - "127.0.0.1:3000:80"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  defense-engine:
    cpus: 0.25
    mem_limit: 384m
    build:
      context: .
      dockerfile: Dockerfile.engine
    environment:
      TEMPO_API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

  analysis-worker:
    cpus: 0.45
    mem_limit: 640m
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["python", "-m", "app.background_worker"]
    environment:
      TEMPO_DB_PATH: /data/tempo.db
      TEMPO_FOREGROUND_ACTIVITY_URL: http://api:8000/api/system/foreground-requests-active
      TEMPO_BACKGROUND_WORKER: "1"
      TEMPO_LICHESS_EXPLORER_TOKEN: ${TEMPO_LICHESS_EXPLORER_TOKEN:-}
      TZ: ${TZ:-America/New_York}
    volumes:
      - tempo-data:/data
    depends_on:
      - api
    restart: unless-stopped

  maia-worker:
    cpus: 0.3
    mem_limit: 1024m
    build:
      context: .
      dockerfile: Dockerfile.maia
    environment:
      TEMPO_API_URL: http://api:8000
    depends_on:
      - api
    restart: unless-stopped

volumes:
  tempo-data:
    external: true
    name: tempo-data
