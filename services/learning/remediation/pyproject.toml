[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tempo-learning-remediation"
version = "0.1.0"
description = "Durable Learning-owned game-miss obligations on a borrowed transaction"
requires-python = ">=3.12,<3.15"
dependencies = ["tempo-game-evidence-contracts==3.0.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "build==1.4.0", "hatchling==1.27.0", "psycopg[binary]==3.3.6"]

[tool.uv.sources]
tempo-game-evidence-contracts = { path = "../../../contracts/game-evidence", editable = false }

[tool.hatch.build.targets.wheel]
packages = ["src/tempo_learning_remediation"]

[tool.hatch.build.targets.wheel.force-include]
"migrations" = "tempo_learning_remediation/migrations"

[tool.hatch.build.targets.sdist]
include = ["src", "migrations", "tests", "integration", "run_suite.py", "pyproject.toml", "uv.lock", "README.md", "REGRESSIONS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"
