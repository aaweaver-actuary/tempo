[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tempo-learning-review"
version = "0.1.0"
description = "Learning-owned review orchestration with caller-owned persistence"
requires-python = ">=3.12,<3.15"
dependencies = []

[dependency-groups]
dev = ["pytest==9.1.1", "build==1.4.0", "hatchling==1.27.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/tempo_learning_review"]

[tool.hatch.build.targets.sdist]
include = ["hatch_build.py", "src", "tests", "integration", "qualification.py", "run_suite.py", "qualify.py", "pyproject.toml", "uv.lock", "README.md", "REGRESSIONS.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
