[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "tempo-content"
version = "0.1.0"
description = "Independent authored chess content, legal inventory, and immutable publications"
requires-python = ">=3.12,<3.15"
dependencies = [
  "chess==1.11.2",
  "tempo-chess-core==0.1.0",
  "tempo-content-publication-contracts==1.0.0",
  "pydantic==2.12.5",
  "psycopg[binary]==3.3.6",
  "psycopg-pool==3.3.3",
]

[project.scripts]
tempo-content = "tempo_content.cli:main"

[dependency-groups]
dev = ["pytest==9.1.1", "build==1.4.0", "hatchling==1.27.0", "jsonschema==4.25.1"]

[tool.uv.sources]
tempo-chess-core = { path = "../../packages/chess-core" }
tempo-content-publication-contracts = { path = "../../contracts/content-publication" }

[tool.hatch.build.targets.wheel]
packages = ["src/tempo_content"]

[tool.hatch.build.targets.sdist]
include = ["hatch_build.py", "src", "tests", "integration", "fixtures", "run_suite.py", "pyproject.toml", "uv.lock", "README.md", "INTERFACES.md", "REGRESSIONS.md", "VALIDATION.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib -ra"

[tool.hatch.build.hooks.custom]
path = "hatch_build.py"
